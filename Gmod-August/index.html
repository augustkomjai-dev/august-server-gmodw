<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - My GMod Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-container">
        <h1 class="title">WELCOME TO SERVER</h1>
        <p class="server-name" id="serverName">My Garry's Mod Server</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <p class="status" id="status">กำลังโหลด...</p>
        
        <div class="player-info" id="playerInfo" style="display:none;">
            <p>ยินดีต้อนรับ: <span id="playerName">Player</span></p>
        </div>
        
        <div class="tips">
            <p id="tipText">💡 เคล็ดลับ: กด F1 เพื่อดูคำสั่งต่างๆ</p>
        </div>
        
        <div class="footer">
            <p>กำลังเชื่อมต่อกับเซิร์ฟเวอร์...</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
